<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="55%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#34d399" stroke-width="6" stroke-opacity="0.35" />
  <!-- Golden Brazil Accent Pill at Top -->
  <rect x="136" y="68" width="240" height="22" rx="11" fill="url(#goldGrad)" />
  <!-- Bold M$ Monogram -->
  <text x="256" y="345" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="235" text-anchor="middle" fill="#ffffff" letter-spacing="-8">M$</text>
  <!-- Bottom Subtle Tag Bar -->
  <rect x="116" y="408" width="280" height="36" rx="18" fill="#064e3b" />
  <text x="256" y="433" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="22" text-anchor="middle" fill="#6ee7b7" letter-spacing="4">MEI BRASIL</text>
</svg>
